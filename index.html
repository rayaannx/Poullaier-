<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1f6f43">
  <link rel="manifest" href="manifest.json">
  <title>Poulailler - Séries</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div>
    <h1>🐔 Poulailler</h1>
    <p>Suivi des séries sur 50 jours</p>
  </div>
  <button id="installBtn" class="secondary hidden">Installer</button>
</header>

<main class="container">
  <section id="alerts"></section>

  <section class="stats">
    <div class="stat"><span>Séries actives</span><strong id="totalSeries">0</strong></div>
    <div class="stat"><span>Poussins vivants</span><strong id="totalBirds">0</strong></div>
    <div class="stat"><span>Morts</span><strong id="totalDeaths">0</strong></div>
    <div class="stat"><span>Aliment total</span><strong id="totalFeed">0 kg</strong></div>
  </section>

  <section class="panel">
    <div class="section-head">
      <h2>Ajouter une série</h2>
    </div>
    <form id="seriesForm" class="form-grid">
      <label>N° de série
        <input id="seriesNumber" required placeholder="Ex : 001">
      </label>
      <label>Date d'entrée
        <input id="entryDate" type="date" required>
      </label>
      <label>Nombre de poussins
        <input id="initialBirds" type="number" min="1" required placeholder="Ex : 5000">
      </label>
      <button class="primary" type="submit">+ Ajouter la série</button>
    </form>
  </section>

  <section class="panel">
    <div class="section-head">
      <h2>Mes séries</h2>
      <button id="clearAllBtn" class="danger-outline">Tout supprimer</button>
    </div>
    <div id="seriesList" class="series-grid"></div>
  </section>
</main>

<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("service-worker.js");</script>
</body>
</html>
