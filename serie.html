<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1f6f43">
  <link rel="manifest" href="manifest.json">
  <title>Poulailler - Série</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div>
    <h1>🐔 <span id="pageTitle">Série</span></h1>
    <p id="pageSubtitle"></p>
  </div>
  <a href="index.html" class="secondary button-link">← Retour</a>
</header>

<main class="container">
  <section id="seriesAlert"></section>

  <section class="stats">
    <div class="stat"><span>Jour</span><strong id="currentDay">-</strong></div>
    <div class="stat"><span>Vivants</span><strong id="liveBirds">-</strong></div>
    <div class="stat"><span>Morts</span><strong id="deadBirds">-</strong></div>
    <div class="stat"><span>Aliment total</span><strong id="feedTotal">-</strong></div>
  </section>

  <section class="panel">
    <div class="section-head">
      <h2>Calendrier des 50 jours</h2>
      <button id="editSeriesBtn" class="secondary">Modifier la série</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Jour</th>
            <th>Date</th>
            <th>Vivants</th>
            <th>Morts du jour</th>
            <th>Aliment (kg)</th>
            <th>Note</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="daysTable"></tbody>
      </table>
    </div>
  </section>

  <section id="editPanel" class="panel hidden">
    <h2>Modifier la série</h2>
    <form id="editForm" class="form-grid">
      <label>N° de série
        <input id="editNumber" required>
      </label>
      <label>Date d'entrée
        <input id="editDate" type="date" required>
      </label>
      <label>Nombre initial de poussins
        <input id="editBirds" type="number" min="1" required>
      </label>
      <button class="primary" type="submit">Enregistrer</button>
      <button id="cancelEdit" class="secondary" type="button">Annuler</button>
    </form>
  </section>
</main>

<div id="dayModal" class="modal hidden">
  <div class="modal-box">
    <div class="section-head">
      <h2 id="modalTitle">Modifier le jour</h2>
      <button id="closeModal" class="icon-btn">×</button>
    </div>
    <form id="dayForm">
      <input id="modalDay" type="hidden">
      <label>Morts pendant ce jour
        <input id="modalDeaths" type="number" min="0" value="0" required>
      </label>
      <label>Aliment consommé (kg)
        <input id="modalFeed" type="number" min="0" step="0.01" value="0" required>
      </label>
      <label>Note
        <textarea id="modalNote" rows="3" placeholder="Ex : traitement, problème, observation..."></textarea>
      </label>
      <button class="primary full" type="submit">Enregistrer</button>
    </form>
  </div>
</div>

<script src="js/storage.js"></script>
<script src="js/serie.js"></script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("service-worker.js");</script>
</body>
</html>
